name: Dist branch
# Keeps the `dist` branch (built plugin files only) in sync with `main`, so installed copies can
# update with `git pull` inside `.obsidian/plugins/lytex-operations-os`.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git fetch origin dist:dist || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish-dist.mjs --skip-build --push
