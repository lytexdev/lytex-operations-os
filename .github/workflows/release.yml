name: Release
# Push a tag that matches manifest.json's version (e.g. `git tag 0.3.0 && git push --tags`).
on:
  push:
    tags: ['*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches manifest version
        run: |
          test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run check
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" --generate-notes --draft
